name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

      - name: Build
        run: go build ./...

      - name: Warm the module proxy and checksum database
        run: |
          MODULE_PATH=$(go list -m)
          mkdir -p /tmp/warm-proxy && cd /tmp/warm-proxy
          go mod init warm-proxy
          GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod go get "${MODULE_PATH}@${GITHUB_REF_NAME}"
